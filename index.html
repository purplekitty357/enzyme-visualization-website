<style>
  html, body { margin: 0; padding: 0; background: #c2e0e5; }
  .poster {
    position: relative;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
  }
  .poster > img { display: block; width: 100%; height: auto; }

  /* 포스터 이미지 위에서 구조 그림이 있던 자리 (이미지 크기 대비 %) */
  .structure {
    position: absolute;
    left: 8.5%;
    top: 21.3%;
    width: 32%;
    height: 23.6%;
  }
  #viewer {
    position: absolute;
    inset: 0;
    cursor: grab;
  }
  #viewer:active { cursor: grabbing; }
  .tools {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2%;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 1;
  }
  .tools button {
    font: 12px sans-serif;
    color: #333;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid #bbb;
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }
  @media (max-width: 600px) {
    .tools button { font-size: 10px; padding: 2px 5px; }
  }
</style>

  const AA3 = { A:"ALA", R:"ARG", N:"ASN", D:"ASP", C:"CYS", Q:"GLN", E:"GLU", G:"GLY", H:"HIS", I:"ILE",
                L:"LEU", K:"LYS", M:"MET", F:"PHE", P:"PRO", S:"SER", T:"THR", W:"TRP", Y:"TYR", V:"VAL" };

  function buildPdb() {
    const bytes = Uint8Array.from(atob(XYZ), c => c.charCodeAt(0));
    const xyz = new Int16Array(bytes.buffer);
    const names = [" N  ", " CA ", " C  ", " O  "];
    const elems = ["N", "C", "C", "O"];
    const f = (v, w, d) => v.toFixed(d).padStart(w);
    const lines = [];
    let serial = 1;
    for (let r = 0; r < SEQ.length; r++) {
      for (let a = 0; a < 4; a++, serial++) {
        const i = (r * 4 + a) * 3;
        lines.push("ATOM  " + String(serial).padStart(5) + " " + names[a] + " " + AA3[SEQ[r]] + " A" +
          String(r + 1).padStart(4) + "    " + f(xyz[i] / 10, 8, 3) + f(xyz[i + 1] / 10, 8, 3) + f(xyz[i + 2] / 10, 8, 3) +
          f(1, 6, 2) + f(PLDDT[r], 6, 2) + "           " + elems[a]);
      }
    }
    lines.push("END");
    return lines.join("\n");
  }

  // AlphaFold pLDDT(신뢰도) 색 – 원래 캡처 그림과 같은 파랑/하늘/노랑/주황
  function plddtColor(atom) {
    const b = atom.b;
    if (b >= 90) return "#0053D6";
    if (b >= 70) return "#65CBF3";
    if (b >= 50) return "#FFDB13";
    return "#FF7D45";
  }

  const viewer = $3Dmol.createViewer("viewer", { backgroundColor: "white", backgroundAlpha: 0, antialias: true });
  let spinning = true;

  // 끝의 긴 꼬리(신호 펩타이드)는 빼고 몸통에 맞춰 화면을 채움
  function fitView() {
    viewer.zoomTo({ resi: "17-465" });
    viewer.zoom(1.1);
    viewer.render();
  }

  viewer.addModel(buildPdb(), "pdb");
  viewer.setStyle({}, { cartoon: { colorfunc: plddtColor } });
  fitView();
  viewer.spin("y", 0.6);

  // 창 크기가 바뀌면 포스터와 함께 뷰어 크기도 맞춤
  window.addEventListener("resize", () => { viewer.resize(); viewer.render(); });

  document.getElementById("spin-btn").addEventListener("click", e => {
    spinning = !spinning;
    viewer.spin(spinning ? "y" : false, 0.6);
    e.target.textContent = spinning ? "회전 멈춤" : "자동 회전";
  });
  document.getElementById("reset-btn").addEventListener("click", fitView);
</script>
